name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: junhyung.cloud
  IMAGE: junhyung.cloud/mc-agents/bot-fabric
  ASSETS_IMAGE: junhyung.cloud/mc-agents/mc-assets

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      # One Minecraft version, named once in gradle.properties. Everything below reads it from
      # here rather than writing it again, so moving to a new version stays a change to that file.
      minecraft: ${{ steps.versions.outputs.minecraft }}
      loader: ${{ steps.versions.outputs.loader }}
      api: ${{ steps.versions.outputs.api }}
      modVersion: ${{ steps.versions.outputs.modVersion }}
      # Whether anything the image is built from changed. A docs-only push leaves the image, the
      # tag and the release alone, so :<version> keeps pointing at the build that was smoked.
      shipped: ${{ steps.version.outputs.shipped }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The version check diffs against the commit this one replaced, which a shallow
          # clone does not have.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - id: versions
        run: |
          property() { sed -n "s/^$1=//p" gradle.properties | tr -d '[:space:]'; }
          echo "minecraft=$(property minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "loader=$(property loader_version)" >> "$GITHUB_OUTPUT"
          echo "api=$(property fabric_api_version)" >> "$GITHUB_OUTPUT"
          echo "modVersion=$(property mod_version)" >> "$GITHUB_OUTPUT"

      # On a pull request the base branch is the comparison; on a push it is the commit that was
      # replaced. A force push leaves nothing to compare against - the commit it names is gone -
      # and the first push to a branch names the all-zero sha, so only the consistency half runs
      # in either case.
      - name: version is consistent and was raised
        id: version
        env:
          FORCED: ${{ github.event.forced }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EMPTY_SHA: '0000000000000000000000000000000000000000'
        run: |
          if [ "$FORCED" = true ] || [ -z "$BASE" ] || [ "$BASE" = "$EMPTY_SHA" ]; then
            bash hack/check-version.sh
          else
            bash hack/check-version.sh "$BASE"
          fi

      # CatalogHashes.java is generated from the catalogue of one mcp-server release and names
      # it, so a catalogue change shows up as a diff to review rather than as tools quietly going
      # dark at the next handshake. Regenerating from that release is what makes the name true:
      # a file edited by hand, or generated from a working tree that never shipped, differs here.
      - name: the catalogue hashes match the mcp-server release they name
        run: |
          set -eu
          file=src/main/java/kr/junhyung/mcagents/botfabric/tool/CatalogHashes.java
          source=$(sed -n 's/.*CATALOG_SOURCE = "\(.*\)";/\1/p' "$file")
          if ! printf '%s' "$source" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$file was generated from '$source', not from an mcp-server release; run hack/sync-catalog.py --from <tag>" >&2
            exit 1
          fi
          python3 hack/sync-catalog.py --from "$source"
          git diff --exit-code -- "$file"

      - run: ./gradlew build

      # By name, not by glob. build/libs keeps every jar it has ever produced, so on a tree that
      # has been built before, *.jar is several copies of one mod and Fabric refuses to load a
      # duplicate mod id. A CI runner starts clean and would never have shown it.
      - name: collect the mod jar
        env:
          MOD_VERSION: ${{ steps.versions.outputs.modVersion }}
          MINECRAFT: ${{ steps.versions.outputs.minecraft }}
        run: |
          set -eu
          rm -rf dist
          jar="build/libs/botfabric-${MOD_VERSION}+${MINECRAFT}.jar"
          test -f "$jar" || { echo "no $jar; did the build produce a different name?" >&2; exit 1; }
          mkdir -p dist
          cp "$jar" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: dist/
          if-no-files-found: error

  # The end to end check, and the reason a version bump is survivable: it joins a real Paper
  # server, draws a frame and presses a dialog button. Slow enough to keep out of `check`.
  smoke:
    needs: check
    if: needs.check.outputs.shipped != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: dist

      - name: build the bot image
        run: |
          set -eu
          docker build \
            --build-arg MINECRAFT_VERSION=${{ needs.check.outputs.minecraft }} \
            --build-arg LOADER_VERSION=${{ needs.check.outputs.loader }} \
            --build-arg FABRIC_API_VERSION=${{ needs.check.outputs.api }} \
            -t bot-fabric:ci .

      # The dialog registry is only read when the world loads, so the datapack goes in after the
      # first boot and the server restarts.
      - name: start Paper
        env:
          MC_VERSION: ${{ needs.check.outputs.minecraft }}
        run: |
          set -eu
          wait_healthy() {
            for _ in $(seq 1 90); do
              status=$(docker inspect -f '{{.State.Health.Status}}' bot-fabric-dev-minecraft-1)
              [ "$status" = healthy ] && return 0
              sleep 10
            done
            docker compose -f dev/compose.yml logs --tail 50
            return 1
          }
          docker compose -f dev/compose.yml up -d
          wait_healthy
          docker cp dev/datapack/botcheck bot-fabric-dev-minecraft-1:/data/world/datapacks/botcheck
          docker compose -f dev/compose.yml restart
          wait_healthy
          docker exec bot-fabric-dev-minecraft-1 rcon-cli "datapack list enabled"

      - name: join, draw a frame, press a dialog button
        run: |
          set -eu
          mkdir -p dev/out
          timeout 900 python3 dev/rpc-harness.py dev/ci-smoke.txt --port 8765 --out dev/out &
          harness=$!
          docker run -d --name bot \
            --add-host host.docker.internal:host-gateway \
            -e MCP_SERVER_HOST=host.docker.internal \
            -e MCP_SERVER_PORT=8765 \
            bot-fabric:ci
          wait "$harness"

      - name: what the bot saw
        if: always()
        run: docker logs bot 2>&1 | tail -100 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-mc${{ needs.check.outputs.minecraft }}
          path: dev/out/
          if-no-files-found: warn

  publish:
    needs: [check, smoke]
    if: github.event_name != 'pull_request' && needs.check.outputs.shipped != 'false'
    runs-on: ubuntu-latest
    permissions:
      # write for the git tag and the release, and in this job alone.
      contents: write
      # Harbor takes a robot account, so the credentials are repository secrets. cosign
      # stays keyless: the certificate comes from Fulcio and no key lives here either.
      # Lets cosign fetch a short-lived certificate from Fulcio, so no key lives in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The release notes are the commits since the previous tag, which a shallow clone
          # has neither of.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: dist

      # The operator composes a fabric bot's image as <tag>-mc<minecraftVersion>, so every tag
      # published here has to carry the suffix: see operator internal/botimage/resolver.go.
      - id: tag
        env:
          VERSION: ${{ needs.check.outputs.modVersion }}
          MINECRAFT: ${{ needs.check.outputs.minecraft }}
        run: |
          set -eu
          stamp=$(date -u +%Y%m%d%H%M%S)
          sha=$(git rev-parse --short=8 HEAD)
          case "$VERSION" in *-*) sep=. ;; *) sep=- ;; esac
          echo "release=${VERSION}-mc${MINECRAFT}" >> "$GITHUB_OUTPUT"
          echo "immutable=${VERSION}${sep}${stamp}.g${sha}-mc${MINECRAFT}" >> "$GITHUB_OUTPUT"
          echo "moving=latest-mc${MINECRAFT}" >> "$GITHUB_OUTPUT"

      # Both images are a JRE plus packages plus jars -- nothing in them is compiled here -- so
      # the only thing emulation has to run is apt-get.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: sigstore/cosign-installer@v3

      # Mojang's manifest lists org.lwjgl:*:natives-linux for every architecture and ships only
      # x86_64 inside it. fetch-minecraft.py takes LWJGL's own natives-linux-arm64 from Maven
      # Central instead, which is what makes an arm64 bot possible at all.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            MINECRAFT_VERSION=${{ needs.check.outputs.minecraft }}
            LOADER_VERSION=${{ needs.check.outputs.loader }}
            FABRIC_API_VERSION=${{ needs.check.outputs.api }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.release }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.immutable }}
            ${{ env.IMAGE }}:${{ steps.tag.outputs.moving }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-mc${{ needs.check.outputs.minecraft }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-mc${{ needs.check.outputs.minecraft }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: sign image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # The asset fetcher, from the same script the bot runs. A bot image cannot carry the client
      # jar -- it is Mojang's to distribute -- so something has to fill the cache it mounts, and
      # keeping one copy of the script is what stops the layout it writes from drifting from the
      # layout the bot reads.
      - id: assets
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.assets
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            MINECRAFT_VERSION=${{ needs.check.outputs.minecraft }}
            LOADER_VERSION=${{ needs.check.outputs.loader }}
          tags: |
            ${{ env.ASSETS_IMAGE }}:${{ steps.tag.outputs.release }}
            ${{ env.ASSETS_IMAGE }}:${{ steps.tag.outputs.immutable }}
            ${{ env.ASSETS_IMAGE }}:${{ steps.tag.outputs.moving }}

      - name: sign assets image
        run: cosign sign --yes "${{ env.ASSETS_IMAGE }}@${{ steps.assets.outputs.digest }}"

      # The image tags map the version to a build; the git tag maps it to a commit, which is what
      # a bisect or a diff between two releases needs, and the release carries the jar for a
      # client run by hand. A tag that is already there is left where it is: a re-run of this job
      # must not say a different commit shipped the version. The notes are the commits since the
      # previous tag, because what GitHub would generate is pull request titles and this
      # repository is pushed to.
      - name: tag and release
        env:
          VERSION: ${{ needs.check.outputs.modVersion }}
          RELEASE_TAG: ${{ steps.tag.outputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null \
            || git tag --list 'v*' --sort=-v:refname | grep -v "^v$VERSION\$" | head -1)
          catalog=src/main/java/kr/junhyung/mcagents/botfabric/tool/CatalogHashes.java
          {
            if [ -n "$previous" ]; then
              git log "$previous..$GITHUB_SHA" --format='- %s'
            else
              echo "- first tagged release; the ones before it were images only"
            fi
            echo
            echo "Image \`$IMAGE:$RELEASE_TAG\`, catalogue $(sed -n 's/.*CATALOG_VERSION = "\(.*\)";/\1/p' "$catalog")" \
              "from mcp-server $(sed -n 's/.*CATALOG_SOURCE = "\(.*\)";/\1/p' "$catalog")."
          } > notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md dist/*.jar

      - run: |
          {
            echo "published \`${{ env.IMAGE }}:${{ steps.tag.outputs.release }}\` and \`${{ env.ASSETS_IMAGE }}:${{ steps.tag.outputs.release }}\` for Minecraft ${{ needs.check.outputs.minecraft }}"
            echo ""
            echo "verify:"
            echo '```'
            echo "cosign verify ${{ env.IMAGE }}:${{ steps.tag.outputs.release }} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
